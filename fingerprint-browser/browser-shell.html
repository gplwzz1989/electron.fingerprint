<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-src 'none'"><title>浏览器基座</title><link rel="stylesheet" href="browser-shell.css"></head>
<body>
  <header class="browser-chrome">
    <div class="tab-row"><div class="pinned-tabs" role="tablist" aria-label="固定首页"><div class="tab active"><button class="tab-select" data-action="home">首页</button></div></div><div class="browser-tabs" role="tablist" aria-label="网页标签"></div><button class="add-tab" data-action="new" aria-label="新建标签页"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="all-tabs" data-action="tabs-menu" aria-label="全部标签" title="全部标签"><span class="overflow-count" hidden></span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><div class="drag-space"></div><div class="window-actions"><button data-action="minimize" aria-label="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button data-action="maximize" aria-label="最大化"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></svg></button><button class="window-close" data-action="exit" aria-label="关闭窗口"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div>
    <div class="address-row"><button data-action="back" aria-label="后退" disabled><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><button data-action="forward" aria-label="前进" disabled><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button><button data-action="reload" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M20 9a8 8 0 1 0 0 6M20 3v6h-6"/></svg></button><label class="address-field"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c4 5 4 13 0 18-4-5-4-13 0-18Z"/></svg><input id="address" aria-label="固定首页地址（只读）" readonly spellcheck="false"><span id="readonly-label">只读</span></label><button data-action="downloads" aria-label="打开下载目录" title="打开下载目录"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></button><button data-action="menu" aria-label="浏览器菜单" title="浏览器菜单"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button><button data-action="devtools" aria-label="开发者工具" title="开发者工具"><svg viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-14-2 16"/></svg></button></div>
  </header>
  <p id="error" role="alert" hidden></p>
  <script src="tab-strip-layout.js"></script><script src="browser-navigation.js"></script><script src="browser-shell.js"></script>
</body></html>
