<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: https:; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline';">
  <title>媒体提取中心</title>
  <style>
    :root {
      --bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --card-bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { background: var(--bg); color: var(--text); font-size: 12px; user-select: none; display: flex; flex-direction: column; height: 100vh; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; }
    
    /* 顶部导航 */
    .header { background: #f8fafc; border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
    .adapter-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; background: #eff6ff; color: #1d4ed8; padding: 3px 8px; border-radius: 4px; border: 1px solid #bfdbfe; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
    .tabs-nav { display: flex; background: #e2e8f0; padding: 2px; border-radius: 6px; gap: 2px; }
    .tab-btn { border: 0; background: transparent; padding: 3px 10px; font-size: 11px; font-weight: 500; color: var(--muted); border-radius: 4px; cursor: pointer; }
    .tab-btn.active { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

    /* 分类过滤器 */
    .filter-bar { background: #fff; border-bottom: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .pills { display: flex; gap: 4px; overflow-x: auto; }
    .pill { border: 1px solid var(--border); background: #f1f5f9; color: var(--muted); padding: 2px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; white-space: nowrap; }
    .pill.active { background: #1e293b; color: #fff; border-color: #1e293b; font-weight: 600; }
    .batch-btn { border: 0; background: transparent; color: var(--primary); font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .batch-btn:hover { text-decoration: underline; }

    /* 主内容区 */
    .content { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* 元信息卡片 */
    .meta-card { display: flex; gap: 10px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
    .meta-thumb { width: 72px; height: 50px; border-radius: 4px; object-cover: cover; background: #334155; flex-shrink: 0; overflow: hidden; }
    .meta-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .meta-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
    .meta-title { font-size: 12px; font-weight: 600; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .meta-author { font-size: 11px; color: var(--muted); }

    /* 资源条目 */
    .section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
    .resource-card { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: #fff; transition: border-color .15s; }
    .resource-card:hover { border-color: #93c5fd; }
    .res-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .res-badge { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .badge-video { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .badge-audio { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
    .res-info { min-width: 0; }
    .res-name { font-size: 12px; font-weight: 600; color: var(--text); truncate: true; }
    .res-desc { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .btn-dl { background: var(--primary); color: #fff; border: 0; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; cursor: pointer; flex-shrink: 0; }
    .btn-dl:hover { background: var(--primary-hover); }
    .btn-dl-sec { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; flex-shrink: 0; }
    .btn-dl-sec:hover { background: #e2e8f0; }

    /* 图片网格 */
    .img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .img-item { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #f1f5f9; position: relative; }
    .img-item img { width: 100%; height: 70px; object-fit: cover; display: block; }
    .img-actions { padding: 4px; background: #fff; display: flex; align-items: center; justify-content: space-between; font-size: 10px; }

    /* 任务队列 */
    .task-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: #fff; margin-bottom: 8px; }
    .task-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .task-title { font-weight: 600; font-size: 12px; truncate: true; max-width: 320px; }
    .task-speed { font-size: 11px; color: var(--muted); font-family: monospace; }
    .progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
    .progress-fill { height: 100%; background: var(--primary); transition: width .2s; }
    .task-footer { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); }
    .task-actions { display: flex; gap: 8px; }
    .task-link { color: var(--primary); cursor: pointer; }
    .task-link:hover { text-decoration: underline; }

    /* 底部条 */
    .footer { background: #f8fafc; border-top: 1px solid var(--border); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .empty-state { text-align: center; padding: 40px 10px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>

  <!-- 头部 -->
  <div class="header">
    <div class="adapter-badge">
      <span class="dot"></span>
      <span id="adapter-name">正在匹配适配器...</span>
    </div>
    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-extract" onclick="switchMainTab('extract')">已捕获媒体</button>
      <button class="tab-btn" id="tab-tasks" onclick="switchMainTab('tasks')">下载队列 (<span id="task-count">0</span>)</button>
    </div>
  </div>

  <!-- 分类筛选器 -->
  <div class="filter-bar" id="filter-bar">
    <div class="pills" id="category-pills">
      <button class="pill active" onclick="filterCategory('all')">全部 (<span id="count-all">0</span>)</button>
      <button class="pill" id="pill-video" onclick="filterCategory('video')" style="display:none">视频 (<span id="count-video">0</span>)</button>
      <button class="pill" id="pill-audio" onclick="filterCategory('audio')" style="display:none">音频 (<span id="count-audio">0</span>)</button>
      <button class="pill" id="pill-image" onclick="filterCategory('image')" style="display:none">图片 (<span id="count-image">0</span>)</button>
    </div>
    <button class="batch-btn" id="batch-btn" onclick="downloadAllImages()" style="display:none">全存原图 ↓</button>
  </div>

  <!-- 主提取内容 -->
  <div class="content" id="view-extract">
    <div id="meta-container" class="meta-card" style="display:none">
      <div class="meta-thumb"><img id="meta-cover" src="" alt="封面"></div>
      <div class="meta-info">
        <div class="meta-title" id="meta-title">视频标题</div>
        <div class="meta-author" id="meta-author">作者</div>
      </div>
    </div>

    <!-- 视频组 -->
    <div id="group-video" style="display:none">
      <div class="section-title">🎬 视频资源</div>
      <div id="list-video" style="display:flex; flex-direction:column; gap:6px; margin-top:6px;"></div>
    </div>

    <!-- 音频组 -->
    <div id="group-audio" style="display:none">
      <div class="section-title">🎵 音频资源</div>
      <div id="list-audio" style="display:flex; flex-direction:column; gap:6px; margin-top:6px;"></div>
    </div>

    <!-- 图片组 -->
    <div id="group-image" style="display:none">
      <div class="section-title">🖼️ 图片与封面</div>
      <div class="img-grid" id="grid-image" style="margin-top:6px;"></div>
    </div>

    <div class="empty-state" id="empty-state">
      正在智能解析当前页面媒体资源...<br>请稍候或刷新视频页面
    </div>
  </div>

  <!-- 任务队列内容 -->
  <div class="content" id="view-tasks" style="display:none">
    <div id="tasks-list"></div>
    <div class="empty-state" id="tasks-empty">暂无正在进行的下载任务</div>
  </div>

  <!-- 底部操作 -->
  <div class="footer">
    <span>🛡️ 下载自动遵循环境代理</span>
    <span style="color:var(--primary); cursor:pointer;" onclick="window.mediaApi.closePopover()">收起</span>
  </div>

  <script>
    let currentData = null;
    let currentCategory = 'all';

    async function init() {
      // 监听提取更新与任务变更
      window.mediaApi.onExtractionChanged(data => renderExtraction(data));
      window.mediaApi.onTasksChanged(tasks => renderTasks(tasks));

      // 首次主动获取
      try {
        const data = await window.mediaApi.getExtraction();
        if (data) renderExtraction(data);
        const tasks = await window.mediaApi.getTasks();
        if (tasks) renderTasks(tasks);
      } catch (e) {
        console.error(e);
      }
    }

    function switchMainTab(tab) {
      document.getElementById('tab-extract').classList.toggle('active', tab === 'extract');
      document.getElementById('tab-tasks').classList.toggle('active', tab === 'tasks');
      document.getElementById('view-extract').style.display = tab === 'extract' ? 'flex' : 'none';
      document.getElementById('view-tasks').style.display = tab === 'tasks' ? 'flex' : 'none';
      document.getElementById('filter-bar').style.display = tab === 'extract' ? 'flex' : 'none';
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.pills .pill').forEach(p => p.classList.remove('active'));
      event?.target?.classList.add('active');

      const gVideo = document.getElementById('group-video');
      const gAudio = document.getElementById('group-audio');
      const gImage = document.getElementById('group-image');

      if (cat === 'all') {
        gVideo.style.display = gVideo.dataset.has === 'true' ? 'block' : 'none';
        gAudio.style.display = gAudio.dataset.has === 'true' ? 'block' : 'none';
        gImage.style.display = gImage.dataset.has === 'true' ? 'block' : 'none';
      } else {
        gVideo.style.display = cat === 'video' && gVideo.dataset.has === 'true' ? 'block' : 'none';
        gAudio.style.display = cat === 'audio' && gAudio.dataset.has === 'true' ? 'block' : 'none';
        gImage.style.display = cat === 'image' && gImage.dataset.has === 'true' ? 'block' : 'none';
      }
    }

    function renderExtraction(data) {
      currentData = data;
      const empty = document.getElementById('empty-state');
      if (!data || !data.resources || data.resources.length === 0) {
        empty.style.display = 'block';
        document.getElementById('meta-container').style.display = 'none';
        document.getElementById('group-video').style.display = 'none';
        document.getElementById('group-audio').style.display = 'none';
        document.getElementById('group-image').style.display = 'none';
        document.getElementById('adapter-name').textContent = '未嗅探到多媒体';
        return;
      }
      empty.style.display = 'none';

      document.getElementById('adapter-name').textContent = data.adapterName || '通用适配器';

      // 渲染元数据
      const metaContainer = document.getElementById('meta-container');
      if (data.title) {
        metaContainer.style.display = 'flex';
        document.getElementById('meta-title').textContent = data.title;
        document.getElementById('meta-author').textContent = data.author ? `作者: ${data.author}` : '';
        const coverImg = document.getElementById('meta-cover');
        if (data.coverUrl) {
          coverImg.src = data.coverUrl;
          coverImg.parentElement.style.display = 'block';
        } else {
          coverImg.parentElement.style.display = 'none';
        }
      }

      // 分类统计
      const videos = data.resources.filter(r => r.category === 'video');
      const audios = data.resources.filter(r => r.category === 'audio');
      const images = data.resources.filter(r => r.category === 'image');

      document.getElementById('count-all').textContent = data.resources.length;
      document.getElementById('count-video').textContent = videos.length;
      document.getElementById('count-audio').textContent = audios.length;
      document.getElementById('count-image').textContent = images.length;

      document.getElementById('pill-video').style.display = videos.length ? 'inline-block' : 'none';
      document.getElementById('pill-audio').style.display = audios.length ? 'inline-block' : 'none';
      document.getElementById('pill-image').style.display = images.length ? 'inline-block' : 'none';
      document.getElementById('batch-btn').style.display = images.length > 1 ? 'inline-block' : 'none';

      // 渲染视频
      const gVideo = document.getElementById('group-video');
      const listVideo = document.getElementById('list-video');
      listVideo.innerHTML = '';
      gVideo.dataset.has = videos.length > 0 ? 'true' : 'false';
      gVideo.style.display = videos.length > 0 ? 'block' : 'none';

      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = 'resource-card';
        card.innerHTML = `
          <div class="res-left">
            <div class="res-badge badge-video">${v.quality?.slice(0, 4) || 'MP4'}</div>
            <div class="res-info">
              <div class="res-name">${escapeHTML(v.title || '视频')}</div>
              <div class="res-desc">${escapeHTML(v.quality || '')} · ${escapeHTML(v.size || '')}</div>
            </div>
          </div>
          <button class="btn-dl" data-id="${v.id}">下载</button>
        `;
        card.querySelector('.btn-dl').onclick = () => doDownload(v);
        listVideo.appendChild(card);
      });

      // 渲染音频
      const gAudio = document.getElementById('group-audio');
      const listAudio = document.getElementById('list-audio');
      listAudio.innerHTML = '';
      gAudio.dataset.has = audios.length > 0 ? 'true' : 'false';
      gAudio.style.display = audios.length > 0 ? 'block' : 'none';

      audios.forEach(a => {
        const card = document.createElement('div');
        card.className = 'resource-card';
        card.innerHTML = `
          <div class="res-left">
            <div class="res-badge badge-audio">${escapeHTML((a.format || '音频').toUpperCase())}</div>
            <div class="res-info">
              <div class="res-name">${escapeHTML(a.title || '音频')}</div>
              <div class="res-desc">${escapeHTML(a.quality || '高保真音频')} · ${escapeHTML(a.size || '')}</div>
            </div>
          </div>
          <button class="btn-dl-sec" data-id="${a.id}">提取音频</button>
        `;
        card.querySelector('.btn-dl-sec').onclick = () => doDownload(a);
        listAudio.appendChild(card);
      });

      // 渲染图片
      const gImage = document.getElementById('group-image');
      const gridImage = document.getElementById('grid-image');
      gridImage.innerHTML = '';
      gImage.dataset.has = images.length > 0 ? 'true' : 'false';
      gImage.style.display = images.length > 0 ? 'block' : 'none';

      images.forEach((img, idx) => {
        const item = document.createElement('div');
        item.className = 'img-item';
        item.innerHTML = `
          <img src="${escapeHTML(img.url)}" alt="img" loading="lazy">
          <div class="img-actions">
            <span>${escapeHTML(img.quality || '原图')}</span>
            <span class="task-link" style="font-weight:600">保存</span>
          </div>
        `;
        item.querySelector('.task-link').onclick = () => doDownload(img);
        gridImage.appendChild(item);
      });
    }

    async function doDownload(resource) {
      await window.mediaApi.startDownload(resource);
      switchMainTab('tasks');
    }

    async function downloadAllImages() {
      if (!currentData || !currentData.resources) return;
      const images = currentData.resources.filter(r => r.category === 'image');
      for (const img of images) {
        await window.mediaApi.startDownload(img);
      }
      switchMainTab('tasks');
    }

    function renderTasks(tasks) {
      document.getElementById('task-count').textContent = tasks.length;
      const container = document.getElementById('tasks-list');
      const empty = document.getElementById('tasks-empty');

      if (!tasks || tasks.length === 0) {
        empty.style.display = 'block';
        container.innerHTML = '';
        return;
      }
      empty.style.display = 'none';

      container.innerHTML = tasks.map(t => `
        <div class="task-card">
          <div class="task-head">
            <div class="task-title" title="${escapeHTML(t.title)}">${escapeHTML(t.title)}</div>
            <div class="task-speed">${escapeHTML(t.speed || '')}</div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${t.progress || 0}%; background:${t.status === 'completed' ? '#10b981' : t.status === 'failed' ? '#ef4444' : '#2563eb'}"></div>
          </div>
          <div class="task-footer">
            <span>${t.status === 'completed' ? '已完成' : t.status === 'failed' ? ('失败: ' + escapeHTML(t.error || '')) : (t.progress + '%')}</span>
            <div class="task-actions">
              ${t.status === 'downloading' ? `<span class="task-link" onclick="window.mediaApi.cancelTask('${t.id}')">取消</span>` : ''}
              ${t.status === 'completed' ? `
                <span class="task-link" onclick="window.mediaApi.openFile('${t.id}')">打开文件</span>
                <span class="task-link" onclick="window.mediaApi.openFolder('${t.id}')">所在目录</span>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
