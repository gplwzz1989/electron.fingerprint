<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>栖界 · 产品重构高保真原型</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="browser-chrome" aria-label="浏览器窗口框架">
    <div class="tab-strip">
      <div class="active-app-tab"><span class="brand-symbol small">Q</span><span>栖界 · 工作空间</span><i class="tab-close">×</i></div>
      <button class="add-tab" type="button" aria-label="新建标签">＋</button>
      <div class="window-controls"><i></i><i></i><i></i></div>
    </div>
    <div class="browser-toolbar">
      <button class="chrome-control" type="button" aria-label="后退" disabled>‹</button>
      <button class="chrome-control" type="button" aria-label="前进" disabled>›</button>
      <button class="chrome-control" type="button" aria-label="刷新" disabled>↻</button>
      <div class="address-preview"><span class="address-lock" aria-hidden="true">⌑</span><span>本机工作空间</span><span class="address-status">本地</span></div>
      <button class="chrome-tool" type="button" aria-label="X 发帖控制" title="X 发帖控制" data-route="x-grok-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg></button>
      <button class="chrome-tool" type="button" aria-label="媒体资源" title="媒体资源" data-route="media-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
    </div>
  </div>

  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="#overview" data-route="overview" aria-label="栖界工作台">
        <span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 3.5 27.5 10v12L16 28.5 4.5 22V10L16 3.5Z"/><path d="m4.5 10 11.5 6.5L27.5 10M16 16.5v12M10 7l12 7v7"/></svg></span>
        <span class="brand-word"><b>栖界</b><small>独立浏览环境工作台</small></span>
      </a>

      <button class="workspace-switch" type="button" data-action="notice">
        <span class="workspace-avatar">本</span>
        <span class="workspace-name"><b>本机工作空间</b><small>数据保存在此设备</small></span>
        <span class="workspace-chevron" aria-hidden="true">⌄</span>
      </button>

      <div class="nav-label">核心工作</div>
      <nav id="navigation" aria-label="主导航">
        <a class="nav-link active" href="#overview" data-route="overview" aria-current="page"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg></span><span>工作台</span></a>
        <a class="nav-link" href="#environments" data-route="environments"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="3.5" width="19" height="14" rx="2"/><path d="M8 21h8M12 17.5V21"/></svg></span><span>环境列表</span></a>
        <a class="nav-link" href="#proxies" data-route="proxies"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><path d="M3 12h18M12 2.8c2.2 2.5 3.3 5.6 3.3 9.2s-1.1 6.7-3.3 9.2c-2.2-2.5-3.3-5.6-3.3-9.2S9.8 5.3 12 2.8Z"/></svg></span><span>代理资源</span></a>
        <div class="nav-label secondary">协作与管理</div>
        <a class="nav-link" href="#members" data-route="members"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20M9 10.5a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM16 3.2a4 4 0 0 1 0 7.6M22 20v-1.5a4 4 0 0 0-3-3.9"/></svg></span><span>团队成员</span></a>
        <a class="nav-link" href="#audit" data-route="audit"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2"/><path d="M12 6.5V12l3.5 2"/></svg></span><span>操作记录</span></a>
        <a class="nav-link" href="#billing" data-route="billing"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M7 15h4"/></svg></span><span>订阅计费</span></a>
        <a class="nav-link" href="#settings" data-route="settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 8.7a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Z"/><path d="m19.4 13.2 1.1.8-1.1 2-1.3-.5a7.9 7.9 0 0 1-1.5.9l-.2 1.4h-2.3l-.4-1.3a7.9 7.9 0 0 1-1.7 0l-.8 1.1-2-1.1.5-1.3a7.9 7.9 0 0 1-.9-1.5l-1.4-.2v-2.3l1.3-.4a7.9 7.9 0 0 1 0-1.7l-1.1-.8 1.1-2 1.3.5a7.9 7.9 0 0 1 1.5-.9l.2-1.4h2.3l.4 1.3a7.9 7.9 0 0 1 1.7 0l.8-1.1 2 1.1-.5 1.3a7.9 7.9 0 0 1 .9 1.5l1.4.2v2.3l-1.3.4a7.9 7.9 0 0 1 0 1.7Z"/></svg></span><span>系统设置</span></a>
        <div class="nav-label secondary">可选工具</div>
        <a class="nav-link" href="#creator-video" data-route="creator-video"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg></span><span>AI 创作</span></a>
      </nav>

      <div class="sidebar-bottom">
        <div class="local-note"><span class="local-dot"></span><span><b>本地数据模式</b><small>登录数据不会自动上传</small></span></div>
        <button class="help-link" type="button" data-route="onboarding"><span class="help-mark">?</span><span>了解栖界的工作方式</span><span class="arrow-small">↗</span></button>
        <div class="profile-link"><span class="profile-avatar">用</span><span><b>当前用户</b><small>本机使用者</small></span><button type="button" aria-label="打开系统设置" data-route="settings">···</button></div>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div class="breadcrumb"><span>栖界</span><i>/</i><strong id="page-context">工作台</strong></div>
        <div class="topbar-actions">
          <button class="global-search" type="button" data-route="search" aria-label="搜索环境与功能"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span>搜索环境、分组和操作</span><kbd>Ctrl K</kbd></button>
          <span class="topbar-divider"></span>
          <span class="runtime-status"><i></i>本机运行</span>
          <button class="top-icon" type="button" data-action="notice" aria-label="通知"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg></button>
          <button class="user-chip" type="button" data-route="settings" aria-label="账户与设置"><span class="user-avatar">用</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
        </div>
      </header>
      <main id="page" tabindex="-1"></main>
    </div>
  </div>

  <div class="review-watermark">界面评审稿 · 不连接真实服务</div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="prototype.js"></script>
</body>
</html>
