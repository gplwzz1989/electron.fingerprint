♧</text><circle cx="1460" cy="108" r="13" fill="#CBD9E5" stroke="none" stroke-width="1"/><text x="1460" y="111" fill="#26384B" font-size="9.2" font-weight="700" text-anchor="middle" >用</text><text x="1484" y="112" fill="#748191" font-size="11.5" font-weight="400" text-anchor="middle" >⌄</text><rect x="0" y="0" width="1520" height="1000" rx="0" fill="none" stroke="none" stroke-width="0" pointer-events="none"/><rect x="1410" y="978" width="100" height="15" rx="5" fill="#FFFFFF" stroke="#DFE5E9" stroke-width="1" opacity="0.9"/><text x="1460" y="989" fill="#6C7B89" font-size="8.0" font-weight="400" text-anchor="middle" >界面评审稿</text><text x="269" y="180" fill="#18212D" font-size="10.3" font-weight="400" text-anchor="start" ></text><text x="270" y="177" fill="#718092" font-size="9.2" font-weight="650" text-anchor="start" letter-spacing="1.1">环境列表 / 新建</text><text x="270" y="208" fill="#17212C" font-size="24" font-weight="660" text-anchor="start" >新建环境</text><text x="270" y="229" fill="#6D7988" font-size="10.3" font-weight="400" text-anchor="start" >用三步建立一个可独立管理的浏览环境。</text><circle cx="287" cy="270" r="11" fill="#E7F5EE" stroke="#D7EADF" stroke-width="1"/><text x="287" y="273" fill="#347153" font-size="9.2" font-weight="700" text-anchor="middle" >✓</text><text x="306" y="273" fill="#3B7358" font-size="9.2" font-weight="450" text-anchor="start" >基本信息</text><path d="M355 270L386 270" fill="none" stroke="#DFE4E8" stroke-width="1" stroke-linecap="round" /><circle cx="412" cy="270" r="11" fill="#E7F5EE" stroke="#D7EADF" stroke-width="1"/><text x="412" y="273" fill="#347153" font-size="9.2" font-weight="700" text-anchor="middle" >✓</text><text x="431" y="273" fill="#3B7358" font-size="9.2" font-weight="450" text-anchor="start" >网络连接</text><path d="M480 270L511 270" fill="none" stroke="#DFE4E8" stroke-width="1" stroke-linecap="round" /><circle cx="537" cy="270" r="11" fill="#245EE8" stroke="#245EE8" stroke-width="1"/><text x="537" y="273" fill="#FFFFFF" font-size="9.2" font-weight="700" text-anchor="middle" >3</text><text x="556" y="273" fill="#213C75" font-size="9.2" font-weight="650" text-anchor="start" >指纹配置</text><rect x="270" y="297" width="885" height="612" rx="12" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><text x="292" y="327" fill="#18212D" font-size="13" font-weight="650" text-anchor="start" >确认浏览器配置</text><text x="292" y="346" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >选择内核默认配置或按需填写参数。可用能力以实际运行时检查结果为准。</text><rect x="1050" y="313" width="81" height="23" rx="11" fill="#F0F3F5" stroke="none" stroke-width="1" /><text x="1090" y="328" fill="#667484" font-size="8.0" font-weight="600" text-anchor="middle" >第 3 步 / 共 3 步</text><text x="292" y="380" fill="#344252" font-size="10.3" font-weight="600" text-anchor="start" >指纹配置方式</text><rect x="292" y="393" width="402" height="74" rx="9" fill="#F5F8FF" stroke="#8CABEA" stroke-width="1.2" /><circle cx="309" cy="412" r="5" fill="#FFFFFF" stroke="#245EE8" stroke-width="1.5"/><circle cx="309" cy="412" r="2.5" fill="#245EE8" stroke="none" stroke-width="1"/><text x="324" y="415" fill="#344252" font-size="10.3" font-weight="650" text-anchor="start" >使用内核默认配置</text><text x="324" y="434" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >使用当前运行时提供的默认值。</text><rect x="712" y="393" width="404" height="74" rx="9" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><circle cx="729" cy="412" r="5" fill="#FFFFFF" stroke="#AAB4BE" stroke-width="1.2"/><text x="744" y="415" fill="#344252" font-size="10.3" font-weight="650" text-anchor="start" >自定义配置</text><text x="744" y="434" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >按需调整语言、时区和硬件参数。</text><rect x="292" y="488" width="824" height="171" rx="9" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><text x="311" y="514" fill="#18212D" font-size="11.5" font-weight="650" text-anchor="start" >配置摘要</text><text x="311" y="531" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >首次启动前保存为稳定快照</text><rect x="1020" y="499" width="77" height="21" rx="10" fill="#EDF3FF" stroke="none" stroke-width="1" /><text x="1058" y="513" fill="#3158A0" font-size="8.0" font-weight="600" text-anchor="middle" >待运行时校验</text><text x="311" y="556" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >浏览器内核</text><text x="1095" y="556" fill="#39495A" font-size="9.2" font-weight="550" text-anchor="end" >由当前运行时提供</text><path d="M311 569L1096 569" fill="none" stroke="#EDF0F2" stroke-width="1" stroke-linecap="round" /><text x="311" y="585" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >语言与时区</text><text x="1095" y="585" fill="#39495A" font-size="9.2" font-weight="550" text-anchor="end" >使用设备默认值</text><path d="M311 598L1096 598" fill="none" stroke="#EDF0F2" stroke-width="1" stroke-linecap="round" /><text x="311" y="614" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >屏幕与图形参数</text><text x="1095" y="614" fill="#39495A" font-size="9.2" font-weight="550" text-anchor="end" >按运行时能力检查</text><rect x="292" y="675" width="824" height="50" rx="8" fill="#F3F7FA" stroke="#E1E9EF" stroke-width="1" /><g transform="translate(306 692) scale(0.6667)" fill="none" stroke="#547189" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10" width="15" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></g><text x="331" y="695" fill="#586A7C" font-size="9.2" font-weight="500" text-anchor="start" >创建后，指纹配置随环境保存。修改前需要关闭正在运行的环境。</text><text x="331" y="712" fill="#6F8191" font-size="9.2" font-weight="400" text-anchor="start" >运行时未提供或未校验的能力不会显示为已启用。</text><path d="M292 853L1131 853" fill="none" stroke="#E3E8ED" stroke-width="1" stroke-linecap="round" /><text x="292" y="879" fill="#8793A0" font-size="9.2" font-weight="400" text-anchor="start" >环境数据默认保存在本机。</text><rect x="881" y="865" width="94" height="31" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1" /><text x="928.0" y="884.5" fill="#405062" font-size="10.3" font-weight="600" text-anchor="middle" >上一步</text><rect x="985" y="865" width="130" height="31" rx="7" fill="#245EE8" stroke="#245EE8" stroke-width="1" /><text x="1050.0" y="884.5" fill="#FFFFFF" font-size="10.3" font-weight="600" text-anchor="middle" >创建环境</text><rect x="1173" y="297" width="315" height="382" rx="12" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><text x="1191" y="327" fill="#18212D" font-size="11.5" font-weight="650" text-anchor="start" >指纹配置原则</text><text x="1191" y="351" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >模板仅提供配置起点。实际支持能力由当前运行时决定。</text><path d="M1191 414L1470 414" fill="none" stroke="#E3E8ED" stroke-width="1" stroke-linecap="round" /><circle cx="1198" cy="440" r="7" fill="#E9F5EE" stroke="none" stroke-width="1"/><text x="1198" y="443" fill="#3A795A" font-size="9.2" font-weight="650" text-anchor="middle" >✓</text><text x="1211" y="443" fill="#556374" font-size="9.2" font-weight="450" text-anchor="start" >关闭环境后才能编辑</text><circle cx="1198" cy="475" r="7" fill="#E9F5EE" stroke="none" stroke-width="1"/><text x="1198" y="478" fill="#3A795A" font-size="9.2" font-weight="650" text-anchor="middle" >✓</text><text x="1211" y="478" fill="#556374" font-size="9.2" font-weight="450" text-anchor="start" >未配置时保持内核原生行为</text><path d="M1191 521L1470 521" fill="none" stroke="#E3E8ED" stroke-width="1" stroke-linecap="round" /><text x="1191" y="547" fill="#6D7988" font-size="9.2" font-weight="600" text-anchor="start" >设计说明</text><text x="1191" y="566" fill="#7D8996" font-size="9.2" font-weight="400" text-anchor="start" >配置值会在真实环境中</text><text x="1191" y="581" fill="#7D8996" font-size="9.2" font-weight="400" text-anchor="start" >读取和校验；此稿不写入</text><text x="1191" y="596" fill="#7D8996" font-size="9.2" font-weight="400" text-anchor="start" >环境配置或启动浏览器。</text><text x="1191" y="638" fill="#245EE8" font-size="9.2" font-weight="600" text-anchor="start" >查看连接失败示例 →</text></svg>