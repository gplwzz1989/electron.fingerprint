xt x="338" y="34" fill="#374151" font-size="13" font-weight="600" text-anchor="start" >浏览器环境</text><rect x="1210" y="11" width="270" height="33" rx="6" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1" /><g transform="translate(1221 20) scale(0.6250)" fill="none" stroke="#9CA3AF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></g><text x="1245" y="33" fill="#9CA3AF" font-size="12" font-weight="400" text-anchor="start" >搜索指纹、环境和账号</text><text x="1545" y="33" fill="#245EE8" font-size="13" font-weight="600" text-anchor="end" >登录</text><text x="260" y="104" fill="#18212D" font-size="22" font-weight="650" text-anchor="start" >新建浏览器环境</text><text x="260" y="131" fill="#6B7280" font-size="13" font-weight="400" text-anchor="start" >填写名称，选择已有指纹，按需设置网络即可创建。</text><path d="M1287 164L1287 474" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round" /><text x="1309" y="180" fill="#18212D" font-size="14" font-weight="650" text-anchor="start" >环境摘要</text><text x="1309" y="216" fill="#6B7280" font-size="12" font-weight="400" text-anchor="start" >环境名称</text><text x="1572" y="216" fill="#374151" font-size="12" font-weight="500" text-anchor="end" >未填写</text><path d="M1309 233L1572 233" fill="none" stroke="#EDEFF2" stroke-width="1" stroke-linecap="round" /><text x="1309" y="258" fill="#6B7280" font-size="12" font-weight="400" text-anchor="start" >已选指纹</text><text x="1572" y="258" fill="#374151" font-size="12" font-weight="500" text-anchor="end" >未选择</text><path d="M1309 275L1572 275" fill="none" stroke="#EDEFF2" stroke-width="1" stroke-linecap="round" /><text x="1309" y="300" fill="#6B7280" font-size="12" font-weight="400" text-anchor="start" >指纹兼容性</text><text x="1572" y="300" fill="#374151" font-size="12" font-weight="500" text-anchor="end" >等待检查</text><path d="M1309 317L1572 317" fill="none" stroke="#EDEFF2" stroke-width="1" stroke-linecap="round" /><text x="1309" y="342" fill="#6B7280" font-si