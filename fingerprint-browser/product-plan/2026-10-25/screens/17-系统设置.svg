art" >代理无法连接时阻止启动，不切换到本机网络。</text><rect x="1060" y="409" width="33" height="18" rx="10" fill="#5D9874" stroke="none" stroke-width="1" /><circle cx="1085" cy="418" r="6.5" fill="#FFFFFF" stroke="none" stroke-width="1"/><path d="M289 470L1108 470" fill="none" stroke="#EDF0F2" stroke-width="1" stroke-linecap="round" /><text x="290" y="492" fill="#394858" font-size="10.3" font-weight="600" text-anchor="start" >环境数据位置</text><text x="290" y="510" fill="#7D8996" font-size="8.0" font-weight="400" text-anchor="start" >显示由应用实际配置的本机存储路径。</text><rect x="1010" y="485" width="96" height="28" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1" /><text x="1058.0" y="503.0" fill="#405062" font-size="10.3" font-weight="600" text-anchor="middle" >查看位置</text><rect x="270" y="604" width="857" height="304" rx="12" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><text x="290" y="633" fill="#18212D" font-size="11" font-weight="650" text-anchor="start" >更新与诊断</text><text x="290" y="677" fill="#394858" font-size="10.3" font-weight="600" text-anchor="start" >检查更新</text><text x="290" y="695" fill="#7D8996" font-size="8.0" font-weight="400" text-anchor="start" >检查客户端与内核版本，并保留环境数据。</text><rect x="1000" y="669" width="106" height="28" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1" /><text x="1053.0" y="687.0" fill="#405062" font-size="10.3" font-weight="600" text-anchor="middle" >检查更新</text><path d="M289 730L1108 730" fill="none" stroke="#EDF0F2" stroke-width="1" stroke-linecap="round" /><text x="290" y="752" fill="#394858" font-size="10.3" font-weight="600" text-anchor="start" >导出诊断信息</text><text x="290" y="770" fill="#7D8996" font-size="8.0" font-weight="400" text-anchor="start" >导出前预览字段；不包含登录数据、代理密码或网页正文。</text><rect x="1000" y="744" width="106" height="28" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1" /><text x="1053.0" y="762.0" fill="#405062" font-size="10.3" font-weight="600" text-anchor="middle" >预览内容</text><path d="M289 805L1108 805" fill="none" stroke="#EDF0F2" stroke-width="1" stroke-linecap="round" /><text x="290" y="827" fill="#394858" font-size="10.3" font-weight="600" text-anchor="start" >减少界面动效</text><text x="290" y="845" fill="#7D8996" font-size="8.0" font-weight="400" text-anchor="start" >可跟随系统偏好设置。</text><rect x="1000" y="819" width="106" height="28" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1" /><text x="1053.0" y="837.0" fill="#405062" font-size="10.3" font-weight="600" text-anchor="middle" >跟随系统</text><rect x="1145" y="253" width="343" height="321" rx="12" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><rect x="1163" y="272" width="42" height="42" rx="11" fill="#EDF5EF" stroke="none" stroke-width="1" /><g transform="translate(1174 283) scale(0.8333)" fill="none" stroke="#426D56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></g><text x="1163" y="336" fill="#18212D" font-size="11.5" font-weight="650" text-anchor="start" >能力以实际运行时为准</text><text x="1163" y="359" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >内核版本、平台架构和指纹能力</text><text x="1163" y="374" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >通过本机运行时读取。页面选项</text><text x="1163" y="389" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >不代表能力已经验证。</text><path d="M1163 423L1469 423" fill="none" stroke="#E3E8ED" stroke-width="1" stroke-linecap="round" /><text x="1163" y="447" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >运行时信息</text><text x="1468" y="447" fill="#344252" font-size="9.2" font-weight="550" text-anchor="end" >由客户端提供</text><text x="1163" y="472" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >能力检查</text><text x="1468" y="472" fill="#344252" font-size="9.2" font-weight="550" text-anchor="end" >启动时读取</text><rect x="1163" y="500" width="157" height="30" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1" /><text x="1241.5" y="