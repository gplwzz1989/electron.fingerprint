67" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >直连或指定代理由你选择；失败时提供恢复方法。</text><text x="701" y="683" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" ></text><text x="701" y="730" fill="#245EE8" font-size="9.2" font-weight="600" text-anchor="start" >查看工作流程  →</text><rect x="1098" y="565" width="394" height="194" rx="12" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><rect x="1115" y="582" width="31" height="31" rx="9" fill="#EDF5EF" stroke="none" stroke-width="1" /><g transform="translate(1122 589) scale(0.7083)" fill="none" stroke="#426D56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></g><text x="1115" y="641" fill="#18212D" font-size="11.5" font-weight="650" text-anchor="start" >3. 管理本机数据</text><text x="1115" y="667" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" >数据默认留在本机；未接入的服务明确提示。</text><text x="1115" y="683" fill="#6D7988" font-size="9.2" font-weight="400" text-anchor="start" ></text><text x="1115" y="730" fill="#245EE8" font-size="9.2" font-weight="600" text-anchor="start" >查看工作流程  →</text></svg>