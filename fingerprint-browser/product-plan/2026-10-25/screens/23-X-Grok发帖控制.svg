<svg xmlns="http://www.w3.org/2000/svg" width="380" height="560" viewBox="0 0 380 560"><style>text{font-family:"Microsoft YaHei",sans-serif;dominant-baseline:auto} .thin{font-weight:400}</style><rect width="380" height="560" fill="#F4F6F8"/><rect x="0" y="0" width="380" height="560" rx="12" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><rect x="0" y="0" width="380" height="48" rx="0" fill="#F8FAFB" stroke="none" stroke-width="1" /><path d="M0 48L380 48" fill="none" stroke="#E3E8ED" stroke-width="1" stroke-linecap="round" /><circle cx="24" cy="24" r="10" fill="#EDF5EF" stroke="none" stroke-width="1"/><g transform="translate(16 16) scale(0.6667)" fill="none" stroke="#476F59" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></g><text x="43" y="28" fill="#18212D" font-size="11.5" font-weight="650" text-anchor="start" >X 发帖控制</text><text x="361" y="28" fill="#788593" font-size="14" font-weight="400" text-anchor="middle" >×</text><rect x="12" y="60" width="356" height="86" rx="9" fill="#F8FAFB" stroke="#E3E8ED" stroke-width="1" /><rect x="24" y="72" width="64" height="18" rx="9" fill="#FFF5E8" stroke="none" stroke-width="1" /><circle cx="33" cy="81" r="3" fill="#B87525" stroke="none" stroke-width="1"/><text x="42" y="84" fill="#94601F" font-size="8.0" font-weight="600" text-anchor="start" >未连接</text><text x="24" y="108" fill="#344252" font-size="10.3" font-weight="650" text-anchor="start" >当前没有可用的 X 浏览环境</text><text x="24" y="126" fill="#6D7988" font-size="8.0" font-weight="400" text-anchor="start" >先在目标环境中登录 X，再打开此控制面板。</text><rect x="12" y="158" width="356" height="76" rx="9" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><text x="24" y="180" fill="#344252" font-size="9.2" font-weight="600" text-anchor="start" >发帖状态</text><text x="24" y="199" fill="#6D7988" font-size="9.2" font-weight="450" text-anchor="start" >未启动 · 等待环境</text><text x="345" y="205" fill="#8995A2" font-size="15" font-weight="650" text-anchor="end" font-family="Consolas,monospace">--:--</text><rect x="12" y="246" width="356" height="62" rx="9" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1" /><text x="24" y="269" fill="#344252" font-size="9.2" font-weight="600" text-anchor="start" >发布周期</text><text x="24" y="288" fill="#6D7988" font-size="8.0" font-weight="400" text-anchor="start" >可选 5、10、15 或 30 分钟</text><rect x="251" y="258" width="103" height="29" rx="6" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1" /><text x="263" y="277" fill="#596777" font-size="8.0" font-weight="550" text-anchor="start" >10 分钟 / 次   ⌄</text><rect x="12" y="320" width="216" height="31" rx="7" fill="#F2F4F6" stroke="#F2F4F6" stroke-width="1" /><text x="120.0" y="339.5" fill="#99A4AE" font-size="10.3" font-weight="600" text-anchor="middle" >启动定时发帖</text><rect x="238" y="320" width="130" height="31" rx="7" fill="#F2F4F6" stroke="#F2F4F6" stroke-width="1" /><text x="303.0" y="339.5" fill="#99A4AE" font-size="10.3" font-weight="600" text-anchor="middle" >立即发帖</text><text x="12" y="376" fill="#344252" font-size="9.2" font-weight="600" text-anchor="start" >Grok 创作提示词</text><rect x="12" y="384" width="356" height="78" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1" /><text x="21" y="402" fill="#596777" font-size="7.5" font-weight="400" text-anchor="start" >请写一条关于最新科技、AI或数字化生活的精简推文（X post）。</text><text x="21" y="415" fill="#596777" font-size="7.5" font-weight="400" text-anchor="start" >语言幽默有趣或富有洞察力，字数在120字以内。直接输出推文正文，严</text><text x="21" y="428" fill="#596777" font-size="7.5" font-weight="400" text-anchor="start" >禁输出任何引号、前缀说明或解释。</text><text x="354" y="478" fill="#245EE8" font-size="8.0" font-weight="600" text-anchor="end" >保存提示词</text><text x="12" y="498" fill="#344252" font-size="9.2" font-weight="600" text-anchor="start" >执行日志</text><rect x="12" y="507" width="356" height="39" rx="7" fill="#F8FAFB" stroke="#E3E8ED" 