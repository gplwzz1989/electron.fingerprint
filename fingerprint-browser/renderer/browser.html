<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
  <title>已打开的环境</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <header id="browser-chrome">
    <div class="tabs-row">
      <div id="tabs" role="tablist" aria-label="浏览器网页标签"></div>
      <label class="profile-picker" hidden>
        <span class="sr-only">新环境使用的指纹配置</span>
        <select id="profile-picker"></select>
      </label>
      <button id="new-page-tab" type="button" disabled hidden>新建网页标签</button>
      <button id="new-tab" type="button" hidden>新建环境</button>
      <button id="dashboard" type="button">配置管理</button>
    </div>
    <form id="navigation" class="navigation">
      <button id="back" type="button" aria-label="后退" disabled>后退</button>
      <button id="forward" type="button" aria-label="前进" disabled>前进</button>
      <button id="reload" type="button" disabled>刷新</button>
      <label class="address-field">
        <span class="sr-only">当前标签网址</span>
        <input id="address" placeholder="请输入 http 或 https 网址" autocomplete="off" spellcheck="false">
      </label>
      <button id="go" type="submit" disabled>打开</button>
    </form>
    <div class="tab-info">
      <div id="fingerprint-summary">当前环境网页标签共享会话，不同环境相互隔离。</div>
      <div class="details"><span id="data-dir"></span><span id="status" role="status" aria-live="polite"></span></div>
    </div>
  </header>
  <main class="empty-browser">
    <h1>已打开的环境</h1>
    <p>环境标签由 SaaS 工作台统一管理。</p>
  </main>
  <script src="browser.js"></script>
</body>
</html>
