<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
  <title>指纹浏览器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">指纹内核 · Electron 37</p>
        <h1>指纹浏览器</h1>
        <p class="subtitle">同一窗口支持多个标签，每个标签拥有独立的数据目录、会话和指纹。</p>
      </div>
      <button id="new-profile" class="button button-primary" type="button">新建配置</button>
    </header>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <main class="workspace">
      <section class="profiles-panel panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">配置中心</p>
            <h2>浏览器配置</h2>
          </div>
          <span id="profile-count" class="count-badge">0 个</span>
        </div>
        <div id="profiles-list" class="profiles-list"></div>
        <div class="list-divider"></div>
        <div class="panel-heading compact-heading">
          <div>
            <p class="eyebrow">环境管理</p>
            <h2>独立环境</h2>
          </div>
          <span id="environment-count" class="count-badge">0 个</span>
        </div>
        <div id="environments-list" class="profiles-list"></div>
      </section>

      <section class="editor-panel panel">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">＋</div>
          <h2>开始创建浏览器配置</h2>
          <p>使用配置创建标签，每个标签都拥有独立的持久化会话和数据目录。</p>
          <button id="empty-new-profile" class="button button-primary" type="button">创建第一个配置</button>
        </div>

        <form id="profile-form" hidden>
          <div class="editor-heading">
            <div>
              <p class="eyebrow">配置编辑</p>
              <h2 id="editor-title">新建配置</h2>
            </div>
            <div class="editor-actions">
              <button id="cancel-edit" class="button button-quiet" type="button">取消</button>
              <button class="button button-primary" type="submit">保存配置</button>
            </div>
          </div>

          <div class="form-section">
            <div class="section-title">
              <h3>基本信息</h3>
              <span>用于识别和启动此配置</span>
            </div>
            <div class="form-grid two-columns">
              <label class="field">
                <span>配置名称</span>
                <input id="profile-name" name="name" maxlength="80" required>
              </label>
              <label class="field">
                <span>启动网址</span>
                <input id="profile-url" name="url" type="url" placeholder="https://example.com" required>
              </label>
            </div>
            <label class="toggle-field">
              <input id="profile-enabled" type="checkbox">
              <span>
                <strong>启用指纹配置</strong>
                <small>关闭后，该 Session 使用 Electron 的原生环境值。</small>
              </span>
            </label>
          </div>

          <div class="form-section">
            <div class="section-title">
              <h3>语言与时区</h3>
              <span>保持页面语言和请求语言一致</span>
            </div>
            <div class="form-grid two-columns">
              <label class="field">
                <span>主语言</span>
                <input id="profile-language" placeholder="zh-CN" required>
              </label>
              <label class="field">
                <span>时区</span>
                <input id="profile-timezone" placeholder="Asia/Shanghai" required>
              </label>
            </div>
          </div>

          <div class="form-section">
            <div class="section-title">
              <h3>设备参数</h3>
              <span>只使用当前内核支持的配置字段</span>
            </div>
            <div class="form-grid three-columns">
              <label class="field">
                <span>平台</span>
                <select id="profile-platform">
                  <option value="Win32">Windows（Win32）</option>
                  <option value="MacIntel">macOS（MacIntel）</option>
                  <option value="Linux x86_64">Linux（Linux x86_64）</option>
                </select>
              </label>
              <label class="field">
                <span>处理器线程数</span>
                <input id="profile-cpu" type="number" min="1" max="1024" required>
              </label>
              <label class="field">
                <span>设备内存（GB）</span>
                <input id="profile-memory" type="number" min="1" max="1024" required>
              </label>
              <label class="field">
                <span>屏幕宽度</span>
                <input id="profile-screen-width" type="number" min="1" required>
              </label>
              <label class="field">
                <span>屏幕高度</span>
                <input id="profile-screen-height" type="number" min="1" required>
              </label>
              <label class="field">
                <span>设备缩放比例</span>
                <input id="profile-scale" type="number" min="0.1" step="0.05" required>
              </label>
            </div>
          </div>

          <div class="form-section">
            <div class="section-title">
              <h3>可选模块</h3>
              <span>用于测试不同模块在独立 Session 中的行为</span>
            </div>
            <div class="toggle-grid">
              <label class="toggle-field compact">
                <input id="noise-canvas" type="checkbox">
                <span><strong>Canvas 噪声</strong><small>应用稳定的 Canvas 像素处理。</small></span>
              </label>
              <label class="toggle-field compact">
                <input id="noise-audio" type="checkbox">
                <span><strong>Audio 噪声</strong><small>应用稳定的离线音频处理。</small></span>
              </label>
              <label class="toggle-field compact">
                <input id="noise-rects" type="checkbox">
                <span><strong>元素尺寸噪声</strong><small>应用稳定的 DOM 尺寸处理。</small></span>
              </label>
            </div>
          </div>

          <div class="form-section">
            <div class="section-title">
              <h3>浏览器标识</h3>
              <span>留空时使用浏览器默认 User-Agent</span>
            </div>
            <label class="field">
              <span>User-Agent</span>
              <textarea id="profile-user-agent" rows="3" placeholder="留空使用默认值"></textarea>
            </label>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
