<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>标签指纹实测</title>
  <style>
    body { margin: 0; padding: 20px 32px; background: #10141c; color: #f2f5f8; font: 14px "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { color: #a9b7cb; }
    table { width: 100%; border-collapse: collapse; background: #182130; }
    th, td { text-align: left; padding: 8px 16px; border-bottom: 1px solid #354052; }
    th { width: 240px; color: #a9b7cb; font-weight: 400; }
    td { color: #9dc0ff; font: 14px Consolas, "Microsoft YaHei", monospace; overflow-wrap: anywhere; }
    #ready { color: #69d5ad; }
  </style>
</head>
<body>
  <h1>当前标签的真实页面指纹</h1>
  <p>下表由本页面读取浏览器接口生成，不是配置预览，也没有改写浏览器指纹接口。</p>
  <table id="signals"></table>
  <p id="ready">正在读取…</p>
  <script>
    function readWebGL (name) {
      const canvas = document.createElement('canvas')
      const gl = canvas.getContext(name)
      if (!gl) return { available: false }
      const debug = gl.getExtension('WEBGL_debug_renderer_info')
      const extensions = gl.getSupportedExtensions() || []
      const pixel = new Uint8Array(4)
      gl.clearColor(0.25, 0.5, 0.75, 1)
      gl.clear(gl.COLOR_BUFFER_BIT)
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel)
      const shader = gl.createShader(gl.VERTEX_SHADER)
      gl.shaderSource(shader, 'attribute vec4 p; void main(){gl_Position=p;}')
      gl.compileShader(shader)
      const startedAt = performance.now()
      for (let index = 0; index < 32; index++) {
        if (debug) gl.getParameter(debug.UNMASKED_RENDERER_WEBGL)
      }
      const getParameterElapsedMs = performance.now() - startedAt
      const result = {
        available: true,
        version: name === 'webgl2' ? 2 : 1,
        vendor: gl.getParameter(gl.VENDOR),
        renderer: gl.getParameter(gl.RENDERER),
        unmaskedVendor: debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null,
        unmaskedRenderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null,
        extensionCount: extensions.length,
        extensions,
        pixel: [...pixel],
        error: gl.getError(),
        shaderCompile: gl.getShaderParameter(shader, gl.COMPILE_STATUS),
        shaderLog: gl.getShaderInfoLog(shader),
        getParameterCalls: 32,
        getParameterElapsedMs
      }
      gl.deleteShader(shader)
      return result
    }

    function parseIceCandidate (candidate) {
      const fields = String(candidate || '').trim().split(/\s+/)
      const typeIndex = fields.indexOf('typ')
      const address = fields[4] || ''
      const type = typeIndex > 0 ? fields[typeIndex + 1] || 'unknown' : 'unknown'
      const protocol = (fields[2] || '').toLowerCase()
      const isMdns = /\.local$/i.test(address)
      const isPrivate = /^(10\.|127\.|169\.254\.|192\.168\.|172\.(1[6-9]|2\d|3[0-1])\.)/.test(address)
      return {
        candidate: String(candidate || ''),
        type,
        protocol,
        address,
        port: Number(fields[5]) || null,
        isMdns,
        isPrivate
      }
    }

    async function collectWebRTCCandidates (iceServers = []) {
      if (typeof RTCPeerConnection !== 'function') return { supported: false, reason: 'RTCPeerConnection 不可用。' }
      let peerConnection
      const candidates = []
      const errors = []
      try {
        peerConnection = new RTCPeerConnection({ iceServers })
        peerConnection.onicecandidate = event => {
          if (event.candidate?.candidate) candidates.push(event.candidate.candidate)
        }
        peerConnection.onicecandidateerror = event => {
          errors.push({
            url: event.url || '',
            errorCode: event.errorCode || 0,
            errorText: event.errorText || ''
          })
        }
        peerConnection.createDataChannel('fingerprint-probe')
        await peerConnection.setLocalDescription(await peerConnection.createOffer())
        await new Promise(resolve => {
          const timeout = setTimeout(resolve, 4000)
          if (peerConnection.iceGatheringState === 'complete') {
            clearTimeout(timeout)
            resolve()
            return
          }
          peerConnection.addEventListener('icegatheringstatechange', () => {
            if (peerConnection.iceGatheringState === 'complete') {
              clearTimeout(timeout)
              resolve()
            }
          })
        })
        const sdpCandidates = (peerConnection.localDescription?.sdp || '')
          .split('\r\n')
          .filter(line => line.startsWith('a=candidate:'))
          .map(line => line.slice(2))
        const uniqueCandidates = [...new Set([...candidates, ...sdpCandidates])]
        const stats = []
        try {
          const reports = await peerConnection.getStats()
          reports.forEach(report => {
            if (report.type !== 'local-candidate' && report.type !== 'candidate-pair') return
            const address = report.address || report.ip || ''
            stats.push({
              type: report.type,
              candidateType: report.candidateType || '',
              protocol: report.protocol || '',
              address,
              port: report.port || null,
              relayProtocol: report.relayProtocol || '',
              url: report.url || ''
            })
          })
        } catch {
          errors.push({ url: '', errorCode: 0, errorText: '读取 WebRTC 统计失败。' })
        }
        const parsed = uniqueCandidates.map(parseIceCandidate)
        const outcome = errors.length > 0 || peerConnection.iceGatheringState === 'failed'
          ? 'network-error'
          : parsed.length > 0
            ? 'candidate'
            : 'no-candidate'
        return {
          supported: true,
          outcome,
          gatheringState: peerConnection.iceGatheringState,
          candidates: parsed,
          stats,
          errors,
          hasHost: parsed.some(item => item.type === 'host'),
          hasMdnsHost: parsed.some(item => item.type === 'host' && item.isMdns),
          hasSrflx: parsed.some(item => item.type === 'srflx'),
          hasRelay: parsed.some(item => item.type === 'relay'),
          hasNonMdnsHost: parsed.some(item => item.type === 'host' && !item.isMdns),
          hasUdpSrflx: parsed.some(item => item.type === 'srflx' && item.protocol === 'udp'),
          hasUdpNonMdnsHost: parsed.some(item => item.type === 'host' && item.protocol === 'udp' && !item.isMdns)
        }
      } catch {
        return { supported: true, outcome: 'network-error', gatheringState: peerConnection?.iceGatheringState || 'failed', candidates: [], stats: [], errors: [{ url: '', errorCode: 0, errorText: 'WebRTC 候选采集失败。' }] }
      } finally {
        peerConnection?.close()
      }
    }

    async function readFingerprint () {
      const webgl = readWebGL('webgl')
      const webgl2 = readWebGL('webgl2')
      const canvas = document.createElement('canvas')
      const twoD = canvas.getContext('2d')
      twoD.fillStyle = '#123456'
      twoD.fillRect(0, 0, 1, 1)
      const headers = await (await fetch('/headers')).json()
      const signals = {
        language: navigator.language,
        languages: [...navigator.languages],
        intlLocale: Intl.DateTimeFormat().resolvedOptions().locale,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        hardwareConcurrency: navigator.hardwareConcurrency,
        deviceMemory: navigator.deviceMemory,
        platform: navigator.platform,
        screenWidth: screen.width,
        screenHeight: screen.height,
        webglVendor: webgl.unmaskedVendor || '不可用',
        webglRenderer: webgl.unmaskedRenderer || '不可用',
        webgl,
        webgl2,
        webrtc: await collectWebRTCCandidates(),
        canvas2dDataUrlLength: canvas.toDataURL().length,
        acceptLanguage: headers.acceptLanguage,
        userAgent: navigator.userAgent
      }
      const labels = {
        language: '主语言', languages: '语言列表', intlLocale: 'Intl 区域', timezone: '时区', hardwareConcurrency: '处理器线程数',
        deviceMemory: '设备内存（GB）', platform: '平台', screenWidth: '屏幕宽度', screenHeight: '屏幕高度',
        webglVendor: '显卡厂商', webglRenderer: '显卡渲染器', webgl: 'WebGL1 能力', webgl2: 'WebGL2 能力', webrtc: 'WebRTC 候选',
        canvas2dDataUrlLength: 'Canvas 2D 数据长度', acceptLanguage: '请求语言', userAgent: '浏览器标识'
      }
      for (const [key, value] of Object.entries(signals)) {
        const row = document.createElement('tr')
        const label = document.createElement('th')
        const cell = document.createElement('td')
        label.textContent = labels[key]
        cell.textContent = Array.isArray(value) ? value.join(', ') : typeof value === 'object' ? JSON.stringify(value) : String(value)
        row.append(label, cell)
        document.querySelector('#signals').append(row)
      }
      window.testSignals = signals
      window.collectWebRTCCandidates = collectWebRTCCandidates
      document.querySelector('#ready').textContent = '页面读取成功 · 可切换顶部标签对比指纹'
    }
    void readFingerprint().catch(error => {
      window.testError = error instanceof Error ? error.message : String(error)
      document.querySelector('#ready').textContent = `页面读取失败：${window.testError}`
    })
  </script>
</body>
</html>
