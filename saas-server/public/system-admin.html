<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>系统管理 · 栖界</title>
  <link rel="stylesheet" href="/system-admin.css">
  <link rel="stylesheet" href="/ui-components.css">
  <script src="/ui-components.js" defer></script>
  <script src="/system-admin.js" defer></script>
</head>
<body>
  <section id="login" class="login-shell" hidden>
    <aside class="login-brand-panel" aria-label="栖界系统管理平台">
      <a class="login-brand" href="/">
        <span class="login-brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7l9-5Z M3 7l9 5 9-5M12 12v10M7.5 4.5l9 5v5"/></svg></span>
        <span><strong>栖界</strong><small>平台管理中心</small></span>
      </a>
      <div class="login-brand-copy">
        <p class="login-kicker">系统控制台</p>
        <h2>让平台运行<br>井然有序</h2>
        <p>在一个清晰、安全的空间里，管理平台服务与运行配置。</p>
      </div>
      <ul class="login-capabilities" aria-label="可管理内容">
        <li>邮件服务</li><li>支付配置</li><li>能力版本</li><li>客户端更新</li>
      </ul>
      <p class="login-brand-footer">栖界 · 系统管理</p>
    </aside>
    <form id="login-form" class="login-card">
      <div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7l9-5Z M3 7l9 5 9-5M12 12v10M7.5 4.5l9 5v5"/></svg></div>
      <p class="eyebrow">栖界 · 平台控制台</p>
      <h1>系统管理员登录</h1><p class="muted">使用已授予系统管理权限的账号。</p>
      <label for="login-email">邮箱</label>
      <input id="login-email" name="email" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="请输入管理员邮箱" aria-describedby="login-email-hint" required>
      <small id="login-email-hint" class="login-hint">支持粘贴邮箱；首尾空格会自动清理。</small>
      <label for="login-password">密码</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      <button class="primary" type="submit">登录控制台</button>
      <p id="login-message" role="alert" aria-live="assertive"></p>
      <a class="login-back" href="/">返回工作空间</a>
    </form>
  </section>
  <div id="console" class="admin-shell" hidden>
    <aside class="admin-sidebar">
      <a class="brand" href="/">栖界<span>系统控制台</span></a>
      <nav id="admin-nav" aria-label="系统设置分类"></nav>
      <a class="back-link" href="/">← 返回工作空间</a>
    </aside>
    <main>
      <header class="topline"><span>平台级配置 / 系统管理</span><div><span id="identity"></span><button id="logout" type="button">退出登录</button></div></header>
      <div class="page-content">
        <div class="page-heading"><div><p class="eyebrow">平台运行设置</p><h1>系统配置</h1><p class="muted">集中管理邮件、支付、套餐与更新。保存后自动生效。</p></div><span class="permission-tag">系统管理员</span></div>
        <div class="service-status" id="service-status"></div>
        <form id="settings-form">
          <div id="settings-panels"></div>
          <footer class="save-bar"><div><strong id="save-state">配置加载中</strong><p id="revision" class="muted"></p></div><div class="save-actions"><button id="reload" type="button">重新加载</button><button class="primary" type="submit">保存配置</button></div></footer>
        </form>
        <p id="message" class="shadcn-visually-hidden" aria-hidden="true"></p>
        <details class="audit"><summary>最近配置变更</summary><div id="audit-list"></div></details>
      </div>
    </main>
  </div>
  <p id="initial-message" class="initial-message" role="status">正在连接系统控制台…</p>
</body>
</html>
